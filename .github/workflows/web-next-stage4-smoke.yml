name: Web Next Stage 4 Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web-next-stage4-smoke.yml"
      - "config/deploy/**"
      - "docs/examples/**"
      - "scripts/checks/new-web-next-stage4-rollout-config.ps1"
      - "scripts/checks/run-web-next-stage4-*.ps1"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "src/**"
      - "public/**"

permissions:
  contents: read

jobs:
  stage4-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Run Stage 4 Smoke
        shell: powershell
        run: npm run web-next:stage4-smoke

      - name: Typecheck Next Root
        shell: powershell
        run: npm run web-next:typecheck
