name: Mobile Foundation Upgrade

on:
  push:
    branches:
      - mobile-foundation-refactor
    paths:
      - '.github/workflows/mobile-foundation-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    name: Upgrade mobile foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-foundation-refactor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Align core SDK 57 versions before install
        working-directory: mobile
        run: |
          npm pkg delete dependencies.concursomestre
          npm pkg set dependencies.expo='~57.0.0'
          npm pkg set dependencies.react='19.2.3'
          npm pkg set dependencies.react-dom='19.2.3'
          npm pkg set dependencies.react-native='0.86.3'
          npm pkg set dependencies.react-native-web='~0.21.0'
          npm pkg set dependencies.react-native-worklets='0.10.1'
          npm pkg set dependencies.react-native-reanimated='4.5.1'
          npm pkg set dependencies.@expo/vector-icons='^15.0.2'
          npm pkg set dependencies.@react-native-async-storage/async-storage='2.2.0'
          npm pkg set dependencies.expo-asset='~57.0.16'
          npm pkg set dependencies.expo-clipboard='~57.0.1'
          npm pkg set dependencies.expo-constants='~57.0.17'
          npm pkg set dependencies.expo-font='~57.0.3'
          npm pkg set dependencies.expo-secure-store='~57.0.3'
          npm pkg set dependencies.expo-status-bar='~57.0.1'
          npm pkg set dependencies.react-native-gesture-handler='~2.32.0'
          npm pkg set dependencies.react-native-safe-area-context='~5.7.0'
          npm pkg set dependencies.react-native-screens='~4.26.0'
          npm pkg set devDependencies.@types/react='~19.2.4'
          npm pkg set devDependencies.typescript='~6.0.3'
          rm -f package-lock.json

      - name: Install clean SDK 57 dependency tree
        working-directory: mobile
        run: npm install

      - name: Let Expo align native modules
        working-directory: mobile
        run: npx expo install --fix

      - name: Install target foundation libraries
        working-directory: mobile
        run: |
          npx expo install expo-router @expo/ui expo-linking
          npm install @tanstack/react-query@^5 zustand@^5 react-hook-form@^7 zod@^4

      - name: Verify Expo dependency alignment
        working-directory: mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json mobile/app.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(mobile): upgrade foundation dependencies"
          git pull --rebase origin mobile-foundation-refactor
          git push origin HEAD:mobile-foundation-refactor
