name: Mobile Foundation Upgrade

on:
  push:
    branches:
      - mobile-foundation-refactor
    paths:
      - '.github/workflows/mobile-foundation-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    name: Upgrade mobile foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: mobile-foundation-refactor

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Remove web package coupling
        working-directory: mobile
        run: npm pkg delete dependencies.concursomestre

      - name: Upgrade Expo SDK
        working-directory: mobile
        run: |
          npm install expo@~57.0.0
          npx expo install --fix

      - name: Install target foundation libraries
        working-directory: mobile
        run: |
          npx expo install expo-router @expo/ui
          npm install @tanstack/react-query@^5 zustand@^5 react-hook-form@^7 zod@^4

      - name: Verify Expo dependency alignment
        working-directory: mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Typecheck mobile
        working-directory: mobile
        run: npm run typecheck

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore(mobile): upgrade foundation dependencies"
          git push origin HEAD:mobile-foundation-refactor
