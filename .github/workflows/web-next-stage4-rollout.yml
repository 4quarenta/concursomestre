name: Web Next Stage 4 Rollout

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo do rollout
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      base_url:
        description: URL base do Next no ambiente validado
        required: true
        type: string
      expected_canonical_base_url:
        description: Host canonico esperado para metadata, robots e sitemaps
        required: true
        type: string
      legacy_web_base_url:
        description: URL base da SPA legada para validar corte hibrido
        required: false
        default: ""
        type: string
      question_id:
        description: ID real de questao publica
        required: true
        type: string
      ranking_id:
        description: ID real de ranking publico
        required: true
        type: string
      material_id:
        description: ID real de material publico
        required: true
        type: string
      proxy_mode:
        description: Modo do proxy aplicado
        required: true
        default: hybrid
        type: choice
        options:
          - hybrid
          - next-only
      proxy_config_reference:
        description: Caminho local ou URL da configuracao de proxy aplicada
        required: false
        default: docs/examples/nginx-web-next-cutover.conf
        type: string
      notes:
        description: Notas curtas sobre a rodada de staging
        required: false
        default: ""
        type: string
      validate_only:
        description: Validar somente a config, sem executar o gate HTTP
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  stage4-rollout:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-next/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install web-next Dependencies
        run: npm --prefix web-next ci

      - name: Create Stage 4 Rollout Config
        shell: powershell
        run: |
          $workflowRunUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          $configPath = "config/deploy/web-next-stage4-rollout.ci.local.json"
          $gateOutputPath = if ("${{ inputs.environment }}" -eq "production") {
            "docs/reports/web-next-production-gate-ci.json"
          } else {
            "docs/reports/web-next-staging-gate-ci.json"
          }

          $config = [ordered]@{
            Environment = "${{ inputs.environment }}"
            BaseUrl = "${{ inputs.base_url }}"
            LegacyWebBaseUrl = "${{ inputs.legacy_web_base_url }}"
            ExpectedCanonicalBaseUrl = "${{ inputs.expected_canonical_base_url }}"
            QuestionId = "${{ inputs.question_id }}"
            RankingId = "${{ inputs.ranking_id }}"
            MaterialId = "${{ inputs.material_id }}"
            ProxyMode = "${{ inputs.proxy_mode }}"
            ProxyConfigReference = "${{ inputs.proxy_config_reference }}"
            GateOutputPath = $gateOutputPath
            OutputPath = "docs/reports/web-next-stage4-rollout-ci.json"
            GateWorkflow = ".github/workflows/web-next-stage4-rollout.yml"
            WorkflowRunUrl = $workflowRunUrl
            Result = "pending"
            Notes = "${{ inputs.notes }}"
          }

          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $configPath -Encoding utf8
          "WEB_NEXT_STAGE4_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_OUTPUT=docs/reports/web-next-stage4-rollout-ci.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_MARKDOWN=docs/reports/web-next-stage4-rollout-ci.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_PROXY=docs/reports/web-next-stage4-rollout-ci.proxy.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_PROXY_MARKDOWN=docs/reports/web-next-stage4-rollout-ci.proxy.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_HANDOFF=docs/reports/web-next-stage4-handoff-ci.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_HANDOFF_MARKDOWN=docs/reports/web-next-stage4-handoff-ci.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_STATUS=docs/reports/web-next-stage4-status-ci.json" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_STAGE4_STATUS_MARKDOWN=docs/reports/web-next-stage4-status-ci.md" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_GATE_OUTPUT=$gateOutputPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Stage 4 Rollout
        shell: powershell
        run: |
          $arguments = @("-ConfigPath", "${{ env.WEB_NEXT_STAGE4_CONFIG }}")
          if ("${{ inputs.validate_only }}" -eq "true") {
            $arguments += "-ValidateOnly"
          }

          powershell -ExecutionPolicy Bypass -File scripts/checks/run-web-next-stage4-rollout.ps1 @arguments

      - name: Run Stage 4 Handoff
        if: ${{ always() && !inputs.validate_only }}
        shell: powershell
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/checks/run-web-next-stage4-handoff.ps1
          -Stage4ReportPath "${{ env.WEB_NEXT_STAGE4_OUTPUT }}"
          -OutputPath "${{ env.WEB_NEXT_STAGE4_HANDOFF }}"

      - name: Run Stage 4 Status
        if: always()
        shell: powershell
        run: >
          powershell -ExecutionPolicy Bypass -File scripts/checks/run-web-next-stage4-status.ps1
          -ConfigPath "${{ env.WEB_NEXT_STAGE4_CONFIG }}"
          -RolloutReportPath "${{ env.WEB_NEXT_STAGE4_OUTPUT }}"
          -HandoffReportPath "${{ env.WEB_NEXT_STAGE4_HANDOFF }}"
          -OutputPath "${{ env.WEB_NEXT_STAGE4_STATUS }}"

      - name: Append Stage 4 Summary
        if: always()
        shell: powershell
        run: |
          if (Test-Path -LiteralPath "${{ env.WEB_NEXT_STAGE4_MARKDOWN }}") {
            Get-Content -LiteralPath "${{ env.WEB_NEXT_STAGE4_MARKDOWN }}" -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (Test-Path -LiteralPath "${{ env.WEB_NEXT_STAGE4_PROXY_MARKDOWN }}") {
            Get-Content -LiteralPath "${{ env.WEB_NEXT_STAGE4_PROXY_MARKDOWN }}" -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (Test-Path -LiteralPath "${{ env.WEB_NEXT_STAGE4_HANDOFF_MARKDOWN }}") {
            Get-Content -LiteralPath "${{ env.WEB_NEXT_STAGE4_HANDOFF_MARKDOWN }}" -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (Test-Path -LiteralPath "${{ env.WEB_NEXT_STAGE4_STATUS_MARKDOWN }}") {
            Get-Content -LiteralPath "${{ env.WEB_NEXT_STAGE4_STATUS_MARKDOWN }}" -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload Stage 4 Rollout Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-next-${{ inputs.environment }}-stage4-rollout
          path: |
            docs/reports/web-next-stage4-rollout-ci.json
            docs/reports/web-next-stage4-rollout-ci.md
            docs/reports/web-next-stage4-rollout-ci.proxy.json
            docs/reports/web-next-stage4-rollout-ci.proxy.md
            docs/reports/web-next-stage4-handoff-ci.json
            docs/reports/web-next-stage4-handoff-ci.md
            docs/reports/web-next-stage4-status-ci.json
            docs/reports/web-next-stage4-status-ci.md
            docs/reports/web-next-*-gate-ci*.json
            docs/reports/web-next-*-gate-ci*.summary.md
          if-no-files-found: warn
