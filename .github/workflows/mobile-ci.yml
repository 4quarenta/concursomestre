name: Mobile CI

on:
  push:
    branches:
      - main
      - '4quarenta/next-version'
    paths:
      - 'mobile/**'
      - 'backend/api/questions/mobile_list.php'
      - 'backend/modules/questions/**'
      - 'backend/modules/simulations/**'
      - 'src/app/privacy/**'
      - 'src/app/terms/**'
      - 'src/app/support/**'
      - 'src/app/account-deletion/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches:
      - main
      - '4quarenta/**'
    paths:
      - 'mobile/**'
      - 'backend/api/questions/mobile_list.php'
      - 'backend/modules/questions/**'
      - 'backend/modules/simulations/**'
      - 'src/app/privacy/**'
      - 'src/app/terms/**'
      - 'src/app/support/**'
      - 'src/app/account-deletion/**'
      - '.github/workflows/mobile-ci.yml'

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Mobile quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci --prefix mobile

      - name: Verify Expo dependency alignment
        working-directory: mobile
        run: npx expo install --check

      - name: Run Expo Doctor
        working-directory: mobile
        run: npx expo-doctor

      - name: Verify mobile/backend security contracts
        run: npm --prefix mobile run contracts:check

      - name: Run Release Candidate smoke gate
        run: npm --prefix mobile run qa:smoke

      - name: Run store readiness code gate
        run: npm --prefix mobile run store:check

      - name: Typecheck mobile
        run: npm --prefix mobile run typecheck
