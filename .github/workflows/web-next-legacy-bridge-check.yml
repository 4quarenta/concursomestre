name: Web Next Legacy Bridge Check

on:
  workflow_dispatch:
    inputs:
      web_next_base_url:
        description: URL base do web-next a validar
        required: true
        type: string
      legacy_web_base_url:
        description: URL base da SPA legada que deve receber os redirects
        required: true
        type: string
      output_path:
        description: Caminho do relatorio JSON no workspace; deixe vazio para usar o padrao
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  legacy-bridge-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-next/package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Install web-next Dependencies
        run: npm --prefix web-next ci

      - name: Resolve Legacy Bridge Output Path
        shell: powershell
        run: |
          function Get-SummaryReportPath {
            param(
              [string]$JsonPath
            )

            $directory = Split-Path -Parent $JsonPath
            $baseName = [System.IO.Path]::GetFileNameWithoutExtension($JsonPath)
            $summaryFileName = "$baseName.summary.md"

            if ($directory) {
              return Join-Path $directory $summaryFileName
            }

            return $summaryFileName
          }

          $resolvedPath = "${{ inputs.output_path }}"
          if (-not $resolvedPath) {
            $resolvedPath = "docs/reports/web-next-legacy-bridge-check-ci.json"
          }

          "WEB_NEXT_LEGACY_BRIDGE_OUTPUT_PATH=$resolvedPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_NEXT_LEGACY_BRIDGE_SUMMARY_PATH=$(Get-SummaryReportPath -JsonPath $resolvedPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Legacy Bridge Check
        shell: powershell
        env:
          WEB_NEXT_BASE_URL: ${{ inputs.web_next_base_url }}
          WEB_LEGACY_BASE_URL: ${{ inputs.legacy_web_base_url }}
          WEB_NEXT_LEGACY_BRIDGE_CHECK_OUTPUT: ${{ env.WEB_NEXT_LEGACY_BRIDGE_OUTPUT_PATH }}
        run: npm run web-next:legacy-bridge-check

      - name: Append Legacy Bridge Summary
        if: always()
        shell: powershell
        run: |
          node scripts/checks/render-web-next-gate-summary.mjs "${{ env.WEB_NEXT_LEGACY_BRIDGE_OUTPUT_PATH }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Legacy Bridge Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-next-legacy-bridge-check-report
          path: |
            ${{ env.WEB_NEXT_LEGACY_BRIDGE_OUTPUT_PATH }}
            ${{ env.WEB_NEXT_LEGACY_BRIDGE_SUMMARY_PATH }}
          if-no-files-found: warn
