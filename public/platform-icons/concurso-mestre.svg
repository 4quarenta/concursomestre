  <text x="228" y="304" fill="white" font-family="Inter, Arial, sans-serif" font-size="60" font-weight="900">ConcursoMestre</text>
  <text x="230" y="352" fill="#DBEAFE" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="600">
