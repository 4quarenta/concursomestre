#
# Exemplo de corte por rota para colocar o web-next na frente das URLs publicas.
# Ajuste dominio, certificados e upstreams antes de usar em staging/producao.
#
# Premissas:
# - Next.js publico rodando em http://127.0.0.1:3001
# - SPA Vite/backend atual atendendo o restante em http://127.0.0.1:3000
#

upstream concursomestre_web_next {
    server 127.0.0.1:3001;
}

upstream concursomestre_spa {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name concursomestre.com.br www.concursomestre.com.br;

    # Metadados e sitemaps do Next.
    location = /robots.txt {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /sitemap.xml {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /question-sitemap.xml {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /question-sitemap-page.xml {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    # Paginas publicas estaticas.
    location = / {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /planos {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /plans {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /elite {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /faq {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /changelog {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /privacy {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /terms {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location = /checkout/termos-de-adesao {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    # Rotas publicas dinamicas e indexaveis.
    location ^~ /l/ {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location ^~ /question/ {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location ^~ /ranking/ {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location ^~ /material/ {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    location ^~ /promo/ {
        proxy_pass http://concursomestre_web_next;
        include proxy_params;
    }

    # Checkout transacional, area logada e demais rotas continuam na SPA atual.
    location / {
        proxy_pass http://concursomestre_spa;
        include proxy_params;
    }
}
