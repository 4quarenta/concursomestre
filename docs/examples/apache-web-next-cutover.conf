#
# Exemplo de corte por rota para colocar o web-next na frente das URLs publicas.
# Ajuste dominio, caminhos locais e certificados antes de usar em staging/producao.
#
# Premissas:
# - Next.js publico rodando em http://127.0.0.1:3001
# - SPA Vite/backend continuam no mesmo VirtualHost atual
# - mod_proxy, mod_proxy_http e mod_rewrite habilitados
#

<VirtualHost *:80>
    ServerName concursomestre.com.br
    ServerAlias www.concursomestre.com.br

    ProxyPreserveHost On
    RewriteEngine On

    # Metadados e sitemaps do Next devem sair antes de qualquer fallback.
    RewriteRule ^/robots\.txt$ http://127.0.0.1:3001/robots.txt [P,L]
    RewriteRule ^/sitemap\.xml$ http://127.0.0.1:3001/sitemap.xml [P,L]
    RewriteRule ^/question-sitemap\.xml$ http://127.0.0.1:3001/question-sitemap.xml [P,L]
    RewriteRule ^/question-sitemap-page\.xml$ http://127.0.0.1:3001/question-sitemap-page.xml [P,L,QSA]

    # Paginas publicas estaticas.
    RewriteRule ^/$ http://127.0.0.1:3001/ [P,L]
    RewriteRule ^/(planos|plans|elite|faq|changelog|privacy|terms)$ http://127.0.0.1:3001/$1 [P,L]
    RewriteRule ^/checkout/termos-de-adesao$ http://127.0.0.1:3001/checkout/termos-de-adesao [P,L]

    # Rotas publicas dinamicas e indexaveis.
    RewriteRule ^/(l|question|ranking|material|promo)(/.*)?$ http://127.0.0.1:3001/$1$2 [P,L,QSA]

    # A SPA e o backend atuais continuam atendendo todo o resto:
    # - /auth
    # - /dashboard
    # - /practice
    # - /admin
    # - /profile
    # - /checkout/* (exceto /checkout/termos-de-adesao)
    # - demais rotas autenticadas/transacionais

    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
